name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macos-latest è Apple Silicon (arm64), lo stesso target delle release per Mac.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Dati emoji
        run: npm run emoji

      - name: Formattazione
        run: cargo fmt --all -- --check

      - name: Build UI (serve a tauri-build)
        run: npx vite build --config ui/vite.config.ts

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # I runner non hanno dispositivi audio: i test usano OfflineBus e una piattaforma finta.
      - name: Test (e export dei tipi TS)
        run: cargo test --workspace

      - name: Tipi TS aggiornati
        run: git diff --exit-code -- ui/src/lib/api/types

      - name: svelte-check
        run: npm run check

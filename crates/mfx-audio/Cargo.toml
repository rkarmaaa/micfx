[package]
name = "mfx-audio"
description = "MicFX: bus WASAPI, thread di render, mixer, voci, limiter (SPEC §6)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rtrb.workspace = true
thiserror.workspace = true
tracing.workspace = true
assert_no_alloc = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
] }
windows-core.workspace = true

[dev-dependencies]
assert_no_alloc.workspace = true
criterion.workspace = true

[features]
default = []
# Avvolge mixer.render con assert_no_alloc anche fuori dai test (debug).
rt-checks = ["dep:assert_no_alloc"]

[[bench]]
name = "mixer"
harness = false

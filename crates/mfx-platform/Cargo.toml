[package]
name = "mfx-platform"
description = "MicFX: hotkey globali, tasti simulati, dispositivi audio (SPEC §8, §9), Windows e macOS"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crossbeam-channel.workspace = true
serde_json.workspace = true
snap.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_Media_Audio",
    "Win32_Devices_FunctionDiscovery",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# Solo per le binding CoreAudio (crate mfx-audio, modulo coreaudio): una sola copia delle dichiarazioni C.
mfx-audio.workspace = true
